apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: {{ .Values.namespace }}
  labels:
    app: django-app
    tier: backend
spec:
  replicas: {{ .Values.django.replicaCount }}
  selector:
    matchLabels:
      app: django-app
  template:
    metadata:
      labels:
        app: django-app
        tier: backend
    spec:
      containers:
      - name: django-container
        image: "{{ .Values.django.image.repository }}:{{ .Values.django.image.tag }}"
        imagePullPolicy: {{ .Values.django.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.django.service.port }}
          name: http
        envFrom:
        - configMapRef:
            name: django-config
        - secretRef:
            name: django-secret
        command:
        - "sh"
        - "-c"
        - |
          python manage.py migrate && \
          python manage.py collectstatic --noinput && \
          gunicorn electronics_shop.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --graceful-timeout 60
        resources:
          requests:
            memory: {{ .Values.django.resources.requests.memory }}
            cpu: {{ .Values.django.resources.requests.cpu }}
          limits:
            memory: {{ .Values.django.resources.limits.memory }}
            cpu: {{ .Values.django.resources.limits.cpu }}
          startupProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.django.service.port }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.django.service.port }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz/
              port: {{ .Values.django.service.port }}
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: {{ .Values.namespace }}
  labels:
    app: django-app
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.django.service.port }}
    targetPort: {{ .Values.django.service.port }}
    protocol: TCP
    name: http
  selector:
    app: django-app