apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.django.config.dbHost | quote }}
  DB_NAME: {{ .Values.django.config.dbName | quote }}
  DB_USER: {{ .Values.django.config.dbUser | quote }}
  DB_PORT: {{ .Values.django.config.dbPort | quote }}
  DEBUG: {{ .Values.django.config.debug | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: django-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DB_USER: {{ .Values.django.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.django.secrets.dbPassword | quote }}
  SECRET_KEY: {{ .Values.django.secrets.secretKey | quote }}