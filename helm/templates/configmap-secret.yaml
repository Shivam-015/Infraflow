apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.django.config.dbHost | quote }}
  DB_NAME: {{ .Values.django.config.dbName | quote }}
  DB_PORT: {{ .Values.django.config.dbPort | quote }}
  DEBUG: {{ .Values.django.config.debug | quote }}